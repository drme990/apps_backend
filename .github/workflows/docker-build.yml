name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/drme990/apps_backend:latest
            ghcr.io/drme990/apps_backend:${{ github.sha }}

      - name: Deploy backend
        run: |
          cd ~/production
          sed -i "s|image: ghcr.io/drme990/apps_backend:.*|image: ghcr.io/drme990/apps_backend:${{ github.sha }}|" docker-compose.yml
          docker compose pull backend
          docker compose up -d backend
          docker image prune -f